
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Triangle 3D Preview</title>
    <style>
        body {
            background: #0B0B14;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .logo-box {
            width: 220px;
            height: 220px;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .logo-box:hover {
            transform: rotateY(15deg) rotateX(10deg) scale(1.05);
        }
        .desc {
            color: rgba(255,255,255,0.7);
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="logo-box">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- گرادیان نئونی بنفش به آبی -->
                <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#A855F7"/>
                    <stop offset="100%" stop-color="#0098EA"/>
                </linearGradient>
                <!-- هایلایت لبه بالا -->
                <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                </linearGradient>
                <!-- فیلتر درخشش نئونی -->
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>

            <!-- سایه‌ی سه‌بعدی (پشت) -->
            <polygon points="50,94 8,20 92,20" fill="#1e1b4b" opacity="0.8" />

            <!-- مثلث اصلی (رأس پایین) -->
            <polygon points="50,90 10,20 90,20" fill="url(#neonGrad)" stroke="url(#neonGrad)" stroke-width="3" filter="url(#glow)" />

            <!-- هایلایت لبه (ایجاد عمق سه‌بعدی) -->
            <line x1="10" y1="20" x2="90" y2="20" stroke="url(#highlight)" stroke-width="2" />
        </svg>
    </div>
    <div class="desc">مثلث TON برعکس (رأس به پایین) با حس سه‌بعدی و نئونی</div>
</body>
</html>
