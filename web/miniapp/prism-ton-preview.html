
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Prism Logo Preview</title>
    <style>
        body { background: #0B0B14; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; color: white; }
        .title { font-size: 22px; font-weight: bold; margin-bottom: 40px; background: linear-gradient(90deg, #A855F7, #0098EA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-box { width: 250px; height: 250px; }
        svg { width: 100%; height: 100%; }
        .dash { stroke-dasharray: 6 4; animation: dash 2.5s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -20; } }
        .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
        .desc { text-align: center; max-width: 350px; color: rgba(255,255,255,0.7); margin-top: 20px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="title">TON Prism</div>
    <div class="logo-box">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- گرادیان اصلی بنفش به آبی -->
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#A855F7"/>
                    <stop offset="100%" stop-color="#0098EA"/>
                </linearGradient>
                <!-- گرادیان نور ورودی (سفید) -->
                <linearGradient id="whiteLight" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
                    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
                </linearGradient>
            </defs>

            <!-- 1. مثلث اصلی TON (بدنه) -->
            <polygon points="50,8 92,92 8,92" stroke="url(#grad)" stroke-width="4" fill="none" stroke-linejoin="round" />

            <!-- 2. منشور داخلی (شکست نور) -->
            <polygon points="50,42 70,75 30,75" fill="url(#grad)" class="pulse" />

            <!-- 3. نور ورودی (پرداخت) -->
            <path d="M5 50 L40 55" stroke="white" stroke-width="3" stroke-linecap="round" class="dash" />
            <circle cx="5" cy="50" r="3" fill="white" />

            <!-- 4. نورهای شکسته شده خروجی (مسیریابی به شبکه‌ها) -->
            <!-- خروجی به سمت راست (آبی TON) -->
            <line x1="55" y1="65" x2="85" y2="65" stroke="#0098EA" stroke-width="3" stroke-linecap="round" class="dash" />
            <!-- خروجی به پایین راست (بنفش EVM) -->
            <line x1="55" y1="70" x2="75" y2="88" stroke="#A855F7" stroke-width="3" stroke-linecap="round" class="dash" />
            <!-- خروجی به پایین چپ (فیروزه‌ای Base) -->
            <line x1="45" y1="70" x2="25" y2="88" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" class="dash" />

            <!-- 5. گره‌های مقصد (شبکه‌ها) -->
            <circle cx="85" cy="65" r="4" fill="#0098EA" />
            <circle cx="75" cy="88" r="4" fill="#A855F7" />
            <circle cx="25" cy="88" r="4" fill="#22D3EE" />

            <!-- 6. نقطه اتصال ورودی -->
            <circle cx="50" cy="55" r="5" fill="white" class="pulse" />
        </svg>
    </div>
    <div class="desc">
        <strong>مفهوم منشور نور:</strong><br>
        نور سفید (پول اولیه) وارد مثلث TON می‌شود، پروتکل (منشور) آن را می‌شکند و به شبکه‌های مختلف (TON, EVM, Base) مسیریابی می‌کند.
    </div>
</body>
</html>
