
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Gate Logo Preview</title>
    <style>
        body {
            background: #0B0B14;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .logo-container {
            width: 200px;
            height: 200px;
        }
        .logo-container svg {
            width: 100%;
            height: 100%;
        }
        /* Animation */
        .pulse {
            animation: pulse 2s ease-in-out infinite;
            transform-origin: center;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        .dash {
            stroke-dasharray: 6 4;
            animation: dash 3s linear infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: -20; }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="pulseGrad" x1="0" y1="0" x2="100" y2="100">
                    <stop offset="0%" stop-color="#A855F7"/>
                    <stop offset="100%" stop-color="#0098EA"/>
                </linearGradient>
            </defs>
            <!-- Broken gate left side -->
            <path d="M20 80 C20 40 30 20 50 10" stroke="url(#pulseGrad)" stroke-width="4" stroke-linecap="round" />
            <!-- Broken gate right side -->
            <path d="M80 80 C80 40 70 20 50 10" stroke="url(#pulseGrad)" stroke-width="4" stroke-linecap="round" />
            <!-- Horizontal broken lines (data flow) -->
            <line x1="15" y1="50" x2="35" y2="50" stroke="#0098EA" stroke-width="3" class="dash" />
            <line x1="65" y1="50" x2="85" y2="50" stroke="#A855F7" stroke-width="3" class="dash" />
            <!-- Central pulse node -->
            <circle cx="50" cy="50" r="14" fill="url(#pulseGrad)" class="pulse" />
            <circle cx="50" cy="50" r="6" fill="#0B0B14" />
            <!-- Small nodes at ends -->
            <circle cx="20" cy="80" r="4" fill="#A855F7" />
            <circle cx="80" cy="80" r="4" fill="#0098EA" />
        </svg>
    </div>
</body>
</html>
