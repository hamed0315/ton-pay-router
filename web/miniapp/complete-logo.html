
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Loading Logo</title>
    <style>
        body { background: #0B0B14; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { position: relative; width: 250px; height: 250px; }
        svg { width: 100%; height: 100%; }
        
        /* انیمیشن ذرات */
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: float 2.5s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translate(0, 0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(60px, 60px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ذرات نئونی (دقیقاً مثل لودینگ) -->
        <div class="particle" style="background: #A855F7; box-shadow: 0 0 10px #A855F7; animation-delay: 0s;"></div>
        <div class="particle" style="background: #0098EA; box-shadow: 0 0 10px #0098EA; animation-delay: 0.15s;"></div>
        <div class="particle" style="background: #A855F7; box-shadow: 0 0 10px #A855F7; animation-delay: 0.3s;"></div>
        <div class="particle" style="background: #0098EA; box-shadow: 0 0 10px #0098EA; animation-delay: 0.45s;"></div>
        <div class="particle" style="background: #A855F7; box-shadow: 0 0 10px #A855F7; animation-delay: 0.6s;"></div>
        <div class="particle" style="background: #0098EA; box-shadow: 0 0 10px #0098EA; animation-delay: 0.75s;"></div>
        <div class="particle" style="background: #A855F7; box-shadow: 0 0 10px #A855F7; animation-delay: 0.9s;"></div>
        <div class="particle" style="background: #0098EA; box-shadow: 0 0 10px #0098EA; animation-delay: 1.05s;"></div>
        <div class="particle" style="background: #A855F7; box-shadow: 0 0 10px #A855F7; animation-delay: 1.2s;"></div>
        <div class="particle" style="background: #0098EA; box-shadow: 0 0 10px #0098EA; animation-delay: 1.35s;"></div>

        <!-- مثلث نهایی با خط سفید -->
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="position: relative; z-index: 10;">
            <defs>
                <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#A855F7" />
                    <stop offset="100%" stop-color="#0098EA" />
                </linearGradient>
            </defs>
            <polygon points="50,90 10,20 90,20" fill="url(#mainGrad)" />
            <line x1="10" y1="20" x2="90" y2="20" stroke="white" stroke-width="2" opacity="0.8" />
        </svg>
    </div>
</body>
</html>
