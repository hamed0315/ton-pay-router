
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Triangle - Exact from Loading</title>
    <style>
        body { background: #0B0B14; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { width: 300px; height: 300px; }
        svg { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="box">
        <!-- این دقیقاً همان SVG است که در انتهای LoadingScreen.tsx شما وجود دارد -->
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#A855F7" />
                    <stop offset="100%" stop-color="#0098EA" />
                </linearGradient>
            </defs>
            <polygon points="50,90 10,20 90,20" fill="url(#mainGrad)" />
            <line x1="10" y1="20" x2="90" y2="20" stroke="white" stroke-width="2" opacity="0.8" />
        </svg>
    </div>
</body>
</html>
