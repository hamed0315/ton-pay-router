
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Pay Router - Story Preview</title>
    <style>
        body { background: #0B0B14; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .title { font-size: 20px; font-weight: bold; margin-bottom: 40px; background: linear-gradient(90deg, #A855F7, #0098EA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .box { width: 250px; height: 250px; }
        svg { width: 100%; height: 100%; }
        .desc { color: rgba(255,255,255,0.7); margin-top: 20px; text-align: center; max-width: 350px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="title">داستان شکل‌گیری مثلث</div>
    <div class="box">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="mainGrad" x1="0" y1="0" x2="100" y2="100">
                    <stop offset="0%" stop-color="#A855F7"/>
                    <stop offset="100%" stop-color="#0098EA"/>
                </linearGradient>
            </defs>

            <!-- ذرات اولیه (گردانه‌ها) -->
            <circle cx="20" cy="30" r="3" fill="#A855F7"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
            <circle cx="80" cy="30" r="3" fill="#0098EA"><animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.2s" repeatCount="indefinite"/></circle>
            <circle cx="50" cy="80" r="3" fill="#A855F7"><animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>

            <!-- مثلث کوچک اولیه -->
            <polygon points="50,55 40,70 60,70" fill="url(#mainGrad)">
                <animate attributeName="points" values="50,55 40,70 60,70;50,15 10,80 90,80" dur="3s" fill="freeze"/>
            </polygon>

            <!-- هاله درخشش -->
            <circle cx="50" cy="50" r="5" fill="none" stroke="#22D3EE" stroke-width="1">
                <animate attributeName="r" values="5;30;40" dur="3s" fill="freeze"/>
                <animate attributeName="opacity" values="0.8;0.3;0" dur="3s" fill="freeze"/>
            </circle>
        </svg>
    </div>
    <div class="desc">
        <strong>داستان:</strong> گردانه‌های نور جمع می‌شن، مثلث از یک نقطه کوچک شروع می‌شه و با جذب نور، بزرگ و کامل می‌شه.
    </div>
</body>
</html>
